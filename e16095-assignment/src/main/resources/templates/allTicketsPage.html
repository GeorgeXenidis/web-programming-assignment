<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Tickets - Admin Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .empty-message {
            text-align: center;
            color: #666;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .ticket-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.5s ease, transform 0.5s ease, max-height 0.5s ease, margin 0.5s ease, padding 0.5s ease;
            max-height: 150px;
            opacity: 1;
            overflow: hidden;
        }
        .ticket-card.fade-out {
            opacity: 0;
            transform: translateX(30px);
            max-height: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            border: none;
        }
        .ticket-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ticket-info .title {
            font-weight: bold;
            font-size: 1.1em;
            color: #222;
        }
        .ticket-info .ticket-type {
            font-size: 0.9em;
            color: #666;
        }
        .ticket-info .ticket-assignee {
            font-size: 0.9em;
            color: #666;
        }
        .ticket-info .ticket-status {
            font-size: 0.9em;
            color: #666;
        }
        .ticket-info .ticket-comments {
            font-size: 0.9em;
            color: #666;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 0.9em;
            text-decoration: none;
            display: inline-block;
        }
        .btn-edit {
            background-color: #007bff;
        }
        .btn-edit:hover {
            background-color: #0056b3;
        }
        .btn-delete {
            background-color: #dc3545;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tickets List</h2>

    <div id="empty-message" th:if="${#lists.isEmpty(allTicketsList)}" class="empty-message">
        No tickets were found in the system.
    </div>

    <div th:each="ticket : ${allTicketsList}" th:id="'ticket-card-' + ${ticket.id}" class="ticket-card">
        <div class="ticket-info">
            <span class="title" th:text="${ticket.title}">exampleTicketTitle</span>
            <span class="ticket-type" th:text="'Type: ' + ${ticket.ticketType}">Type: exampleTicketType</span>
            <span class="ticket-assignee" th:text="'Assignee ID: ' + ${ticket.assigneeId}">Assignee ID: 1</span>
            <span class="ticket-status" th:text="'Ticket Status: ' + ${ticket.ticketStatus}">Ticket Status: NOT_ASSIGNED</span>
            <span class="ticket-comments" th:text="'Comments: ' + ${ticket.comments}">Comments: A descriptive example of how to resolve the ticket...</span>
        </div>
        <div class="actions">
            <!-- Direct page navigation to details/edit view -->
            <a th:href="@{/api/level-admin/ticketDetails/{id}(id=${ticket.id})}" class="btn btn-edit">Edit</a>

            <!-- Triggers asynchronous deletion and smooth fade-out -->
            <button type="button"
                    class="btn btn-delete"
                    th:onclick="deleteTicket([[${ticket.id}]])">Delete</button>
        </div>
    </div>
</div>

<script>
    async function deleteTicket(ticketId) {
        if (!confirm('Are you sure you want to delete this ticket?')) {
            return;
        }

        const card = document.getElementById(`ticket-card-${ticketId}`);
        const url = `/api/level-admin/ticketDetails/delete`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({ id: ticketId })
            });

            if (response.ok) {
                card.classList.add('fade-out');

                setTimeout(() => {
                    card.remove();

                    const remainingCards = document.querySelectorAll('.ticket-card');
                    if (remainingCards.length === 0) {
                        showEmptyMessage();
                    }
                }, 500);
            } else {
                alert('Failed to delete ticket. Please try again.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred while contacting the server.');
        }
    }

    function showEmptyMessage() {
        let emptyMsg = document.getElementById('empty-message');
        if (!emptyMsg) {
            emptyMsg = document.createElement('div');
            emptyMsg.id = 'empty-message';
            emptyMsg.className = 'empty-message';
            emptyMsg.innerText = 'No tickets were found in the system.';
            document.querySelector('.container').appendChild(emptyMsg);
        }
    }
</script>

</body>
</html>
