<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Announcement - Admin Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .btn-top-logout {
            background-color: #dc3545;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn-top-logout:hover {
            background-color: #c82333;
            transform: translateY(-1px);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .announcement-card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 15px;
        }
        .announcement-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 0.85em;
            font-weight: bold;
            color: #555;
        }
        .form-control {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95em;
            box-sizing: border-box;
            width: 100%;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s;
        }
        .btn-submit {
            background-color: #007bff;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Announcement Form</h2>

    <div class="announcement-card">
        <form id="AnnouncementForm" class="announcement-info">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" class="form-control" th:value="${announcementDto.title}" placeholder="Enter announcement title" required />
            </div>

            <div class="form-group">
                <label for="content">content</label>
                <textarea id="content" class="form-control" rows="4" th:text="${announcementDto.content}" placeholder="Announcement details here..."></textarea>
            </div>

            <div class="actions">
                <button type="button" class="btn btn-submit" onclick="submitAnnouncementForm()">Submit</button>
            </div>
        </form>
    </div>
</div>

<!-- Top-Right Corner Logout Button -->
<div class="top-right-logout">
    <a th:href="@{/api/logout}" class="btn-top-logout">Logout</a>
</div>

<script>
    async function submitAnnouncementForm() {
        const announcementData = {
            title: document.getElementById('title').value,
            content: document.getElementById('content').value
        };

        const url = `/api/level-admin/announcements/new`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(announcementData)
            });

            if (response.ok) {
                alert('Announcement created successfully!');
                window.location.href = '/api/level-admin/announcements/new'; // Reset or redirect after submit
            } else {
                alert('Failed to create announcement. Please check your inputs.');
            }
        } catch (error) {
            console.error('Error creating announcement:', error);
            alert('An error occurred while contacting the server.');
        }
    }
</script>

</body>
</html>
