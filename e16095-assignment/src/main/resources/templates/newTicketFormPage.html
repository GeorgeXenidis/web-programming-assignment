<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticket Details - User Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .btn-top-action {
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: background-color 0.2s ease, transform 0.1s ease;
            color: white;
        }
        .btn-top-action:hover {
            transform: translateY(-1px);
        }
        .btn-main {
            background-color: #007bff;
        }
        .btn-main:hover {
            background-color: #0056b3;
        }
        .btn-logout {
            background-color: #dc3545;
        }
        .btn-logout:hover {
            background-color: #c82333;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .ticket-card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 15px;
        }
        .ticket-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 0.85em;
            font-weight: bold;
            color: #555;
        }
        .form-control {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95em;
            box-sizing: border-box;
            width: 100%;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s;
        }
        .btn-submit {
            background-color: #007bff;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ticket Form</h2>

    <div class="ticket-card">
        <form id="ticketForm" class="ticket-info">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" class="form-control" th:value="${ticketDto.title}" placeholder="Enter ticket title" required />
            </div>

            <div class="form-group">
                <label for="ticketType">Ticket Type</label>
                <select id="ticketType" class="form-control" name="ticketType" required>
                    <option value="" disabled selected>Select type of ticket</option>
                    <option value="SOFTWARE">SOFTWARE</option>
                    <option value="HARDWARE">HARDWARE</option>
                    <option value="SYSTEM_ACCESS">SYSTEM_ACCESS</option>
                    <option value="NET_ACCESS">NET_ACCESS</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comments">Comments</label>
                <textarea id="comments" class="form-control" rows="4" th:text="${ticketDto.comments}" placeholder="Describe your issue..."></textarea>
            </div>

            <div class="actions">
                <button type="button" class="btn btn-submit" onclick="submitTicketForm()">Submit</button>
            </div>
        </form>
    </div>
</div>

<!-- Top-Right Navigation Header -->
<div class="top-right-actions">
    <a th:href="@{/api/mainPage}" class="btn-top-action btn-main">Main Page</a>
    <a th:href="@{/api/logout}" class="btn-top-action btn-logout">Logout</a>
</div>

<script>
    async function submitTicketForm() {
        const ticketData = {
            title: document.getElementById('title').value,
            ticketType: document.getElementById('ticketType').value,
            comments: document.getElementById('comments').value
        };

        const url = `/api/level-user/application/newTicketForm`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(ticketData)
            });

            if (response.ok) {
                alert('Ticket submitted successfully!');
                window.location.href = '/api/level-user/application/newTicketForm'; // Reset or redirect after submit
            } else {
                alert('Failed to submit ticket. Please check your inputs.');
            }
        } catch (error) {
            console.error('Error submitting ticket:', error);
            alert('An error occurred while contacting the server.');
        }
    }
</script>

</body>
</html>
