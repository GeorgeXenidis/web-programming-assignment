<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrations for Approval - Admin Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .btn-top-action {
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: background-color 0.2s ease, transform 0.1s ease;
            color: white;
        }
        .btn-top-action:hover {
            transform: translateY(-1px);
        }
        .btn-main {
            background-color: #007bff;
        }
        .btn-main:hover {
            background-color: #0056b3;
        }
        .btn-logout {
            background-color: #dc3545;
        }
        .btn-logout:hover {
            background-color: #c82333;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .empty-message {
            text-align: center;
            color: #666;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .user-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.5s ease, transform 0.5s ease, max-height 0.5s ease, margin 0.5s ease, padding 0.5s ease;
            max-height: 150px;
            opacity: 1;
            overflow: hidden;
        }
        .user-card.fade-out {
            opacity: 0;
            transform: translateX(30px);
            max-height: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            border: none;
        }
        .user-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .user-info .username {
            font-weight: bold;
            font-size: 1.1em;
            color: #222;
        }
        .user-info .email {
            font-size: 0.9em;
            color: #666;
        }
        .user-info .role-badge {
            display: inline-block;
            font-size: 0.8em;
            color: #888;
            margin-top: 4px;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 0.9em;
            text-decoration: none;
        }
        .btn-approve {
            background-color: #28a745;
        }
        .btn-approve:hover {
            background-color: #218838;
        }
        .btn-reject {
            background-color: #dc3545;
        }
        .btn-reject:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pending Registrations</h2>

    <div id="empty-message" th:if="${#lists.isEmpty(allPendingRegistrationsList)}" class="empty-message">
        No pending registrations at this time.
    </div>

    <div th:each="user : ${allPendingRegistrationsList}" th:id="'user-card-' + ${user.id}" class="user-card">
        <div class="user-info">
            <span class="username" th:text="${user.username}">johndoe</span>
            <span class="email" th:text="${user.email}">john@example.com</span>
            <span class="role-badge" th:text="'Role: ' + ${user.role}">Role: NOT_ASSIGNED</span>
        </div>
        <div class="actions">
            <!-- Passes the full user object converted to JSON -->
            <button type="button"
                    class="btn btn-approve"
                    th:onclick="processRegistration([[${user}]], 'approve')">Approve</button>
            <button type="button"
                    class="btn btn-reject"
                    th:onclick="processRegistration([[${user}]], 'reject')">Reject</button>
        </div>
    </div>
</div>

<!-- Top-Right Navigation Header -->
<div class="top-right-actions">
    <a th:href="@{/api/mainPage}" class="btn-top-action btn-main">Main Page</a>
    <a th:href="@{/api/logout}" class="btn-top-action btn-logout">Logout</a>
</div>

<script>
    async function processRegistration(userObject, action) {
        const card = document.getElementById(`user-card-${userObject.id}`);

        // Base URL with query param only
        const url = `/api/register/approvals/?action=${action}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                // Send the entire user object in the request body
                body: JSON.stringify(userObject)
            });

            if (response.ok) {
                card.classList.add('fade-out');

                setTimeout(() => {
                    card.remove();

                    const remainingCards = document.querySelectorAll('.user-card');
                    if (remainingCards.length === 0) {
                        showEmptyMessage();
                    }
                }, 500);
            } else {
                alert('Failed to process action. Please try again.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred while contacting the server.');
        }
    }

    function showEmptyMessage() {
        let emptyMsg = document.getElementById('empty-message');
        if (!emptyMsg) {
            emptyMsg = document.createElement('div');
            emptyMsg.id = 'empty-message';
            emptyMsg.className = 'empty-message';
            emptyMsg.innerText = 'No pending registrations at this time.';
            document.querySelector('.container').appendChild(emptyMsg);
        }
    }
</script>

</body>
</html>
